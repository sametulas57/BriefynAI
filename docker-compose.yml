# Sabit proje adı: Docker birimleri klasör adından bağımsız (briefynai_sql_data). 2026-10-21, klasör/depo adı BriefynAI oldu.
name: briefynai

services:
  # ==========================================
  # 1. VERİTABANI (Microsoft SQL Server)
  # ==========================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: briefyn-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      # S9a: yalnız bu bilgisayardan erişilir (veritabanı araçları için). Ağdaki başka cihazlar bağlanamaz;
      # web servisi Docker ağı içinden "db" adıyla bağlanır.
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # S9a / ADR-0009: veritabanını ve iki girişi her açılışta hazırlar: briefyn_app (uygulama, yalnız okur/yazar) ve
  # briefyn_migrator (yalnız migrate servisi, şemayı kurar). sa yalnız burada ve db-readonly'de kullanılır.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      - db
    environment:
      - SQLCMDPASSWORD=${MSSQL_SA_PASSWORD}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - MIGRATOR_DB_PASSWORD=${MIGRATOR_DB_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/init-app-user.sh"]
    restart: "no"

  # ADR-0009: şemayı (EF migration'ları, Hangfire ve log tabloları) kurar ve çıkar. Web bu adım bitmeden başlamaz.
  migrate:
    build:
      context: ./MeetingWeb
    entrypoint: ["dotnet", "run", "--", "migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=BriefynDB;User Id=briefyn_migrator;Password=${MIGRATOR_DB_PASSWORD};TrustServerCertificate=True;
      - EncryptionSettings__KeyV2=${ENCRYPTION_KEY_V2}
    volumes:
      - ./MeetingWeb:/app
      - /app/bin
      - /app/obj
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Salt okunur giriş; tablolar kurulduktan sonra çalışır ki parola sütunlarını kapatabilsin.
  db-readonly:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - SQLCMDPASSWORD=${MSSQL_SA_PASSWORD}
      - READONLY_DB_PASSWORD=${READONLY_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/init-app-user.sh", "readonly"]
    restart: "no"

  # ==========================================
  # 2. YAPAY ZEKA MOTORU (Python FastAPI)
  # ==========================================
  ai_engine:
    build: 
      context: ./ai_engine
    container_name: briefyn-ai
    ports:
      # S5: yalnız bu bilgisayardan erişilir (Docker'sız yerel geliştirme için); ağdaki başka cihazlar ulaşamaz.
      # Web servisi Docker ağı içinden ai_engine:8000 adresiyle bağlanır.
      - "127.0.0.1:8000:8000"
    environment:
      # Faz 2: yazıya dökme ve özet Groq'ta (ZDR Groq panelinden açılır). Anahtar .env'deki GROQ_KEY.
      - GROQ_API_KEY=${GROQ_KEY}
      # Paylaşılan anahtar .env'den gelir; yoksa servis her isteği reddeder (503).
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY}
    volumes:
      - ./ai_engine:/app
    restart: unless-stopped

  # ==========================================
  # 3. WEB BACKEND (C# ASP.NET Core)
  # ==========================================
  web:
    build:
      context: ./MeetingWeb
    container_name: briefyn-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # S9a: sa değil, yalnız BriefynDB'ye yetkili kullanıcı.
      - ConnectionStrings__DefaultConnection=Server=db;Database=BriefynDB;User Id=briefyn_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;
      - PythonApiSettings__BaseUrl=http://ai_engine:8000/
      - PythonApiSettings__ApiKey=${AI_ENGINE_API_KEY}
      # Sırlar .env dosyasından gelir (git'e girmez).
      - EmailSettings__SenderEmail=${EMAIL_SENDER}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      # ADR-0010: veriler v3 (AES-256-GCM, kolona bağlı), anahtar numarası 1 = ENCRYPTION_KEY_V2. Eski Key/IV
      # uygulamaya verilmiyor; .env'de yalnız 17 Ekim 2026 öncesi yedekler için saklanıyor.
      - EncryptionSettings__KeyV2=${ENCRYPTION_KEY_V2}
      # Hangfire paneli (/hangfire) yalnız bu e-postaya açılır; boşsa kimse giremez.
      - Hangfire__DashboardAdminEmails__0=${HANGFIRE_ADMIN_EMAIL:-}
      # ADR-0011: Zoom uygulamasının bilgileri; boşsa Zoom özelliği kapalı görünür.
      - Zoom__ClientId=${ZOOM_CLIENT_ID:-}
      - Zoom__ClientSecret=${ZOOM_CLIENT_SECRET:-}
      
      # 1. SİNYAL: Docker içindeki .NET motorunun dosya değişikliklerini anlık yakalamasını tetikler
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      
    volumes:
      # 2. BAĞLANTI: Bilgisayarındaki C# kod klasörünü Docker içindeki çalışma klasörüne canlı bağlar (Hot Reload için)
      - ./MeetingWeb:/app
      
      # 3. KORUMA: Yüklenen profil fotoğrafları "down" yapınca silinmesin diye bilgisayarındaki klasöre mühürler
      - ./MeetingWeb/wwwroot/uploads:/app/wwwroot/uploads
      
      # 4. KAVGA ENGELLEYİCİ: Docker'ın derlediği Linux dosyalarının Mac'e sızıp kırmızı çizgi yapmasını engeller
      - /app/bin
      - /app/obj
      
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai_engine:
        condition: service_started
    restart: unless-stopped

# ==========================================
# KALICI DEPOLAMA ALANLARI (Volumes)
# ==========================================
volumes:
  sql_data: