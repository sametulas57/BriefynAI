# Sabit proje adı: Docker birimleri klasör adından bağımsız (briefynai_pg_data). 2026-10-21, klasör/depo adı BriefynAI oldu.
name: briefynai

services:
  # ==========================================
  # 1. VERİTABANI (PostgreSQL)
  # ==========================================
  db:
    image: postgres:18
    container_name: briefyn-pg
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # S9a: yalnız bu bilgisayardan erişilir (veritabanı araçları için). Ağdaki başka cihazlar bağlanamaz;
      # web servisi Docker ağı içinden "db" adıyla bağlanır.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      retries: 30

  # S9a / ADR-0009: veritabanını ve iki girişi her açılışta hazırlar: briefyn_app (uygulama, yalnız okur/yazar) ve
  # briefyn_migrator (yalnız migrate servisi, şemayı kurar). Süper kullanıcı postgres yalnız burada ve db-readonly'de kullanılır.
  db-init:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - MIGRATOR_DB_PASSWORD=${MIGRATOR_DB_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/init-app-user.sh"]
    restart: "no"

  # ADR-0009: şemayı (EF migration'ları, Hangfire ve log tabloları) kurar ve çıkar. Web bu adım bitmeden başlamaz.
  migrate:
    build:
      context: ./MeetingWeb
    entrypoint: ["dotnet", "run", "--", "migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=briefyn;Username=briefyn_migrator;Password=${MIGRATOR_DB_PASSWORD}
      - EncryptionSettings__KeyV2=${ENCRYPTION_KEY_V2}
    volumes:
      - ./MeetingWeb:/app
      - /app/bin
      - /app/obj
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Salt okunur giriş; tablolar kurulduktan sonra çalışır ki parola sütunlarını kapatabilsin.
  db-readonly:
    image: postgres:18
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - READONLY_DB_PASSWORD=${READONLY_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "/db/init-app-user.sh", "readonly"]
    restart: "no"

  # ==========================================
  # 2. WEB BACKEND (C# ASP.NET Core)
  # ==========================================
  web:
    build:
      context: ./MeetingWeb
    container_name: briefyn-web
    ports:
      # Varsayılan: yalnız bu bilgisayardan (iOS Simülatörü de bu bilgisayardan sayılır). Gerçek telefonla
      # ev ağında denemek için .env'de WEB_BIND=0.0.0.0; ortak ağlarda (kafe, okul) açık bırakılmaz.
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # S9a: yalnız briefyn veritabanını okuyan/yazan kullanıcı; süper kullanıcı postgres kullanılmaz.
      - ConnectionStrings__DefaultConnection=Host=db;Database=briefyn;Username=briefyn_app;Password=${APP_DB_PASSWORD}
      # Yapay zekâ hattı web sürecinde (ADR-0018); yazıya dökme ve özet Groq'ta (ZDR Groq panelinden açılır). Anahtar .env'deki GROQ_KEY.
      - GROQ_API_KEY=${GROQ_KEY}
      # Yazıya dökme: boş ya da azure = yüklenen dosyalar Azure Speech'te (konuşmacı ayırma); groq = Groq. Zoom kayıtları her durumda Groq + Zoom'un adları.
      - TRANSCRIBER=${TRANSCRIBER:-azure}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_ENDPOINT=${AZURE_SPEECH_ENDPOINT:-}
      # Arşive soru sor (ADR-0014): boşsa koddaki varsayılan. Model değişimi yalnız .env'den.
      - ANSWERER=${ANSWERER:-}
      - AI_ANSWER_MODEL=${AI_ANSWER_MODEL:-}
      # Sırlar .env dosyasından gelir (git'e girmez).
      - EmailSettings__SenderEmail=${EMAIL_SENDER}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      # ADR-0010: veriler v3 (AES-256-GCM, kolona bağlı), anahtar numarası 1 = ENCRYPTION_KEY_V2. Eski Key/IV
      # uygulamaya verilmiyor; .env'de yalnız 17 Ekim 2026 öncesi yedekler için saklanıyor.
      - EncryptionSettings__KeyV2=${ENCRYPTION_KEY_V2}
      # Hangfire paneli (/hangfire) yalnız bu e-postaya açılır; boşsa kimse giremez.
      - Hangfire__DashboardAdminEmails__0=${HANGFIRE_ADMIN_EMAIL:-}
      # ADR-0011: Zoom uygulamasının bilgileri; boşsa Zoom özelliği kapalı görünür.
      - Zoom__ClientId=${ZOOM_CLIENT_ID:-}
      - Zoom__ClientSecret=${ZOOM_CLIENT_SECRET:-}
      # Zoom yerel adres kabul etmiyor; tünelle denerken https adresi buradan verilir (ör. trycloudflare).
      - Zoom__RedirectUri=${ZOOM_REDIRECT_URI:-http://127.0.0.1:8080/Zoom/Callback}
      # ADR-0012: Zoom bildirimlerinin gizli anahtarı (Secret Token); boşsa otomatik alma kapalı.
      - Zoom__WebhookSecret=${ZOOM_WEBHOOK_SECRET:-}
      
      # 1. SİNYAL: Docker içindeki .NET motorunun dosya değişikliklerini anlık yakalamasını tetikler
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      
    volumes:
      # 2. BAĞLANTI: Bilgisayarındaki C# kod klasörünü Docker içindeki çalışma klasörüne canlı bağlar (Hot Reload için)
      - ./MeetingWeb:/app
      
      # 3. KORUMA: Yüklenen profil fotoğrafları "down" yapınca silinmesin diye bilgisayarındaki klasöre mühürler
      - ./MeetingWeb/wwwroot/uploads:/app/wwwroot/uploads
      
      # 4. KAVGA ENGELLEYİCİ: Docker'ın derlediği Linux dosyalarının Mac'e sızıp kırmızı çizgi yapmasını engeller
      - /app/bin
      - /app/obj
      
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

# ==========================================
# KALICI DEPOLAMA ALANLARI (Volumes)
# ==========================================
volumes:
  pg_data:
