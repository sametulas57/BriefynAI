name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install CSS tools
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: scripts/verify.sh
      - name: Security audit
        run: |
          dotnet list Briefyn.slnx package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -Eq '\b(High|Critical)\b' audit.txt; then
            exit 1
          fi
